# Serve the built SPA and proxy the API to the backend container (same origin,
# so the SPA's relative /api/* calls just work — no CORS, no VITE_API_BASE).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No URI part on proxy_pass -> the full /api/... path is forwarded as-is.
    location /api/ {
        proxy_pass http://backend:7100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# One Git-driven pipeline: build -> test -> deploy.
# ILLUSTRATIVE STUB — not wired to any CI system. The real execution
# surface is the CML AMP (.project-metadata.yaml, five tasks).
stages: [build, test, deploy]

build:
  stage: build
  script:
    - python infra/install_deps.py
    - python infra/build_frontend.py

test:
  stage: test
  script:
    - python infra/vast_probe.py        # on-cluster connectivity gate

deploy:
  stage: deploy
  script:
    - python pipelines/fetch_model.py
    - python pipelines/prepare_data.py
    - python app/serve_app.py
  when: manual

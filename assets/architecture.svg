  <text x="643" y="152" text-anchor="middle" font-size="10" fill="#5f6b7a">Impala temporal split tables</text>
  <text x="643" y="168" text-anchor="middle" font-size="10" fill="#5f6b7a">train · val · test</text>

  <rect x="746" y="112" width="174" height="74" rx="8" fill="#eef3f8" stroke="#8aa2b8"/>
  <text x="833" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#232f3e">Cloudera AI Jobs (GPU)</text>
  <text x="833" y="152" text-anchor="middle" font-size="10" fill="#5f6b7a">cuDF tokenize · TFM embed</text>
  <text x="833" y="168" text-anchor="middle" font-size="10" fill="#5f6b7a">batch 512-d embeddings</text>

  <line x1="350" y1="149" x2="362" y2="149" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="540" y1="149" x2="552" y2="149" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="730" y1="149" x2="742" y2="149" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- AI row -->
  <rect x="176" y="226" width="500" height="96" rx="10" fill="#fdf3ec" stroke="#e0b394" stroke-width="1.5"/>
  <text x="190" y="246" text-anchor="start" font-size="12" font-weight="700" fill="#232f3e">Cloudera AI — Fraud Cockpit (GPU Application)</text>

  <rect x="188" y="258" width="112" height="52" rx="7" fill="#ffffff" stroke="#e0b394"/>
  <text x="244" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#232f3e">Tokenize · embed</text>
  <text x="244" y="295" text-anchor="middle" font-size="10" fill="#5f6b7a">TFM decoder</text>
  <rect x="310" y="258" width="112" height="52" rx="7" fill="#ffffff" stroke="#e0b394"/>
  <text x="366" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#232f3e">Score</text>
  <text x="366" y="295" text-anchor="middle" font-size="10" fill="#5f6b7a">PCA-64 · XGBoost</text>
  <rect x="432" y="258" width="112" height="52" rx="7" fill="#ffffff" stroke="#e0b394"/>
  <text x="488" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#232f3e">Compare lift</text>
  <text x="488" y="295" text-anchor="middle" font-size="10" fill="#5f6b7a">AUC · AP · UMAP</text>
  <rect x="554" y="258" width="112" height="52" rx="7" fill="#ffffff" stroke="#e0b394"/>
  <text x="610" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#232f3e">Train · export</text>
  <text x="610" y="295" text-anchor="middle" font-size="10" fill="#5f6b7a">in-app, on GPU</text>
  <line x1="300" y1="284" x2="308" y2="284" stroke="#5f6b7a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="422" y1="284" x2="430" y2="284" stroke="#5f6b7a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="544" y1="284" x2="552" y2="284" stroke="#5f6b7a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="700" y="226" width="220" height="96" rx="10" fill="#eef3f8" stroke="#8aa2b8"/>
  <text x="810" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#232f3e">Cloudera AI Registry · Endpoint</text>
  <text x="810" y="266" text-anchor="middle" font-size="10" fill="#5f6b7a">MLflow experiment tfm-fraud-demo</text>
  <text x="810" y="282" text-anchor="middle" font-size="10" fill="#5f6b7a">registered: tfm-fraud-combined</text>
  <text x="810" y="298" text-anchor="middle" font-size="10" fill="#5f6b7a">governed CPU REST endpoint</text>
  <line x1="676" y1="274" x2="696" y2="274" stroke="#f96702" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowO)"/>

  <!-- Between rows -->
  <line x1="600" y1="186" x2="600" y2="222" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="588" y="209" text-anchor="end" font-size="10" fill="#5f6b7a">read splits</text>
  <polyline points="660,226 660,206 790,206 790,190" fill="none" stroke="#f96702" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowO)"/>
  <text x="676" y="200" text-anchor="start" font-size="10" fill="#f96702">launch export</text>

  <!-- SDX -->
  <rect x="176" y="346" width="744" height="40" rx="8" fill="#eef3f8" stroke="#8aa2b8"/>
  <text x="610" y="370" text-anchor="middle" font-size="11" fill="#232f3e"><tspan font-weight="700">SDX</tspan> — Ranger: access to card and account data · Atlas: lineage from data to model version · audit</text>
  <line x1="810" y1="322" x2="810" y2="342" stroke="#f96702" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowO)"/>
  <text x="822" y="337" text-anchor="start" font-size="10" fill="#f96702">lineage</text>

  <!-- Consumers -->
  <rect x="176" y="440" width="240" height="52" rx="10" fill="#fdf3ec" stroke="#f96702" stroke-width="1.5"/>
  <text x="296" y="462" text-anchor="middle" font-size="14" font-weight="600" fill="#232f3e">Analysts · data scientists</text>
  <text x="296" y="480" text-anchor="middle" font-size="11" fill="#5f6b7a">compose transactions · compare lift</text>
  <line x1="296" y1="438" x2="296" y2="326" stroke="#f96702" stroke-width="1.8" marker-end="url(#arrowO)"/>

  <!-- Footer -->
  <rect x="440" y="436" width="496" height="62" rx="8" fill="#ffffff" stroke="#c3ccd6"/>
  <text x="688" y="457" text-anchor="middle" font-size="11" fill="#5f6b7a">Demo today: TabFormer dataset · Impala split tables + Parquet on VAST S3</text>
  <text x="688" y="473" text-anchor="middle" font-size="11" fill="#5f6b7a">one GPU app container (AMP) · optional NEXUS long-term-memory head</text>
  <text x="688" y="489" text-anchor="middle" font-size="11" fill="#5f6b7a">Dashed orange = launch export · register and deploy · lineage</text>
</svg>

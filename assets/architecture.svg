<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f96702"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#fafbfc"/>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#232f3e">Transaction Foundation Model — Target Architecture on Cloudera</text>
  <text x="480" y="47" text-anchor="middle" font-size="11" fill="#5f6b7a">Card transactions are embedded by a transaction foundation model, XGBoost heads score fraud, and the best model is registered and served</text>

  <!-- Sources -->
  <text x="84" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#5f6b7a" letter-spacing="1">SOURCES</text>
  <rect x="24" y="112" width="120" height="60" rx="8" fill="#ffffff" stroke="#8aa2b8"/>
  <text x="84" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#232f3e">Card transactions</text>
  <text x="84" y="154" text-anchor="middle" font-size="10" fill="#5f6b7a">history · fraud labels</text>
  <rect x="24" y="186" width="120" height="60" rx="8" fill="#ffffff" stroke="#8aa2b8"/>
  <text x="84" y="211" text-anchor="middle" font-size="11" font-weight="600" fill="#232f3e">Authorizations</text>
  <text x="84" y="228" text-anchor="middle" font-size="10" fill="#5f6b7a">live scoring requests</text>
  <rect x="24" y="260" width="120" height="60" rx="8" fill="#ffffff" stroke="#8aa2b8"/>
  <text x="84" y="285" text-anchor="middle" font-size="11" font-weight="600" fill="#232f3e">Merchant data</text>
  <text x="84" y="302" text-anchor="middle" font-size="10" fill="#5f6b7a">MCC · city · zip</text>

  <polyline points="144,142 152,142 152,290 144,290" fill="none" stroke="#5f6b7a" stroke-width="1.4"/>
  <line x1="144" y1="216" x2="152" y2="216" stroke="#5f6b7a" stroke-width="1.4"/>
  <line x1="152" y1="149" x2="172" y2="149" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Platform container -->
  <rect x="160" y="62" width="776" height="338" rx="14" fill="#ffffff" stroke="#f96702" stroke-width="2"/>
  <text x="176" y="84" text-anchor="start" font-size="14" font-weight="700" fill="#f96702">Cloudera Data Platform — on-prem or public cloud (GPU nodes)</text>
  <text x="176" y="104" font-size="10" font-weight="700" fill="#5f6b7a" letter-spacing="1">DATA PIPELINE — LANDS, SPLITS AND EMBEDS TRANSACTION HISTORY</text>

  <rect x="176" y="112" width="174" height="74" rx="8" fill="#eef3f8" stroke="#8aa2b8"/>
  <text x="263" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#232f3e">Cloudera DataFlow · NiFi</text>
  <text x="263" y="152" text-anchor="middle" font-size="10" fill="#5f6b7a">lands transaction history</text>
  <text x="263" y="168" text-anchor="middle" font-size="10" fill="#5f6b7a">+ live authorization events</text>

  <rect x="366" y="112" width="174" height="74" rx="8" fill="#eef3f8" stroke="#8aa2b8"/>
  <text x="453" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#232f3e">Open Data Lakehouse</text>
  <text x="453" y="152" text-anchor="middle" font-size="10" fill="#5f6b7a">Iceberg · Parquet on VAST S3</text>
  <text x="453" y="168" text-anchor="middle" font-size="10" fill="#5f6b7a">history + fraud labels</text>

  <rect x="556" y="112" width="174" height="74" rx="8" fill="#eef3f8" stroke="#8aa2b8"/>
